<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#0e141a"/>
<title>Solitude &amp; Ink</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;family=Amiri:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "secondary-container": "#444953",
                    "error": "#ffb4ab",
                    "on-primary-container": "#33271d",
                    "on-primary-fixed": "#241910",
                    "tertiary": "#c4c6ce",
                    "surface-container-lowest": "#090f14",
                    "background": "#0e141a",
                    "primary-fixed": "#f4dfcf",
                    "outline": "#9a8f87",
                    "on-surface-variant": "#d1c4bc",
                    "surface-dim": "#0e141a",
                    "surface-container-high": "#252a31",
                    "secondary-fixed": "#dee2ee",
                    "primary": "#d7c3b4",
                    "secondary-fixed-dim": "#c2c6d2",
                    "outline-variant": "#4e453f",
                    "error-container": "#93000a",
                    "on-secondary-container": "#b4b8c4",
                    "on-tertiary-fixed-variant": "#44474d",
                    "primary-fixed-dim": "#d7c3b4",
                    "on-error": "#690005",
                    "tertiary-fixed": "#e1e2ea",
                    "tertiary-fixed-dim": "#c4c6ce",
                    "surface-container": "#1b2026",
                    "inverse-surface": "#dee3eb",
                    "on-primary-fixed-variant": "#524439",
                    "tertiary-container": "#8e9098",
                    "on-tertiary": "#2d3037",
                    "surface-container-low": "#171c22",
                    "surface-container-highest": "#30353c",
                    "primary-container": "#9f8d80",
                    "surface": "#0e141a",
                    "on-primary": "#3a2e24",
                    "surface-tint": "#d7c3b4",
                    "surface-bright": "#343a40",
                    "on-background": "#dee3eb",
                    "inverse-primary": "#6b5b4f",
                    "on-secondary-fixed-variant": "#424750",
                    "on-secondary": "#2c313a",
                    "on-error-container": "#ffdad6",
                    "on-surface": "#dee3eb",
                    "on-secondary-fixed": "#171c24",
                    "secondary": "#c2c6d2",
                    "surface-variant": "#30353c",
                    "on-tertiary-container": "#272a30",
                    "on-tertiary-fixed": "#191c22",
                    "inverse-on-surface": "#2c3137"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
                },
                "spacing": {
                    "container-padding": "24px",
                    "unit": "8px",
                    "section-margin": "48px",
                    "max-width-content": "680px",
                    "element-gap": "16px"
                },
                "fontFamily": {
                    "display-date": ["EB Garamond"],
                    "body-lg": ["Open Sans"],
                    "headline-md": ["EB Garamond"],
                    "label-sm": ["Open Sans"],
                    "headline-lg": ["EB Garamond"],
                    "body-md": ["Open Sans"]
                },
                "fontSize": {
                    "display-date": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                    "body-lg": ["18px", { "lineHeight": "30px", "fontWeight": "400" }],
                    "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "400" }],
                    "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "500" }],
                    "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }]
                }
            }
        }
    }
</script>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen relative overflow-x-hidden pb-32">

<!-- Binding Line (Desktop/Tablet) -->
<div class="hidden md:block fixed left-[calc(50%-340px)] top-0 bottom-0 w-px bg-primary opacity-20 z-0 pointer-events-none"></div>

<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-container-padding h-16 max-w-max-width-content mx-auto bg-background text-primary border-b border-outline-variant/10 top-0 mb-8 sticky z-40 backdrop-blur-sm bg-opacity-90">
  <button aria-label="Home" id="nav-home-btn" class="flex items-center justify-center w-10 h-10 rounded-full hover:opacity-80 transition-opacity text-on-surface-variant">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <h1 id="app-title" class="font-headline-md text-headline-md text-primary text-center cursor-pointer">Solitude &amp; Ink</h1>
  <button aria-label="Settings" id="nav-settings-btn" class="flex items-center justify-center w-10 h-10 rounded-full hover:opacity-80 transition-opacity text-on-surface-variant">
    <span class="material-symbols-outlined">settings</span>
  </button>
</header>

<!-- View mount point -->
<main id="app-content" class="max-w-max-width-content mx-auto px-container-padding relative z-10"></main>

<!-- Bottom Nav Bar -->
<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-48px)] max-w-[500px] z-50 flex justify-around items-center px-4 h-[72px] rounded-full bg-surface-container-high">
  <button data-route="journal" aria-label="Journal" class="nav-btn flex flex-col items-center justify-center rounded-full p-3 transition-colors duration-200">
    <span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
  </button>
  <button data-route="traits" aria-label="Traits" class="nav-btn flex flex-col items-center justify-center rounded-full p-3 transition-colors duration-200">
    <span class="material-symbols-outlined" data-icon="psychology">psychology</span>
  </button>
  <button data-route="lists" aria-label="Lists" class="nav-btn flex flex-col items-center justify-center rounded-full p-3 transition-colors duration-200">
    <span class="material-symbols-outlined" data-icon="list_alt">list_alt</span>
  </button>
  <button data-route="habits" aria-label="Habits" class="nav-btn flex flex-col items-center justify-center rounded-full p-3 transition-colors duration-200">
    <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
  </button>
  <button data-route="zikr" aria-label="Zikr" class="nav-btn flex flex-col items-center justify-center rounded-full p-3 transition-colors duration-200">
    <span class="material-symbols-outlined" data-icon="settings_heart">settings_heart</span>
  </button>
</nav>

<script src="js/db.js"></script>
<script src="js/applock.js"></script>
<script src="js/trends.js"></script>
<script src="js/modal.js"></script>
<script src="js/home.js"></script>
<script src="js/journal.js"></script>
<script src="js/habits.js"></script>
<script src="js/traits.js"></script>
<script src="js/lists.js"></script>
<script src="js/zikr.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
